app = "your-yunohost-app"
primary_region = "cdg" # Choose your preferred region close to you

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "yunohost_data"
  destination = "/data"
  initial_size = "10gb"

[[services]]
  http_checks = []
  internal_port = 80
  processes = ["app"]
  protocol = "tcp"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

[[services]]
  http_checks = []
  internal_port = 443
  processes = ["app"]
  protocol = "tcp"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
